<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Halaman Tidak Ditemukan | Miranaya Academy</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#0F4C81,#1E88E5);
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    background:#fff;
    color:#333;
    max-width:650px;
    width:100%;
    padding:50px 35px;
    border-radius:18px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.logo{
    font-size:30px;
    font-weight:bold;
    color:#0F4C81;
    margin-bottom:10px;
}

.code{
    font-size:90px;
    font-weight:800;
    color:#1E88E5;
    line-height:1;
}

h1{
    margin:15px 0;
    color:#0F4C81;
}

p{
    color:#666;
    line-height:1.7;
    margin-bottom:35px;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:15px;
}

.btn{
    text-decoration:none;
    padding:14px 28px;
    border-radius:10px;
    font-weight:600;
    transition:.3s;
}

.home{
    background:#1E88E5;
    color:#fff;
}

.home:hover{
    background:#1565C0;
}

.training{
    border:2px solid #1E88E5;
    color:#1E88E5;
}

.training:hover{
    background:#1E88E5;
    color:#fff;
}

.footer{
    margin-top:40px;
    color:#888;
    font-size:14px;
}

@media(max-width:600px){
    .code{
        font-size:70px;
    }

    .buttons{
        flex-direction:column;
    }

    .btn{
        width:100%;
    }
}
</style>

</head>
<body>

<div class="container">

    <div class="logo">
        Miranaya Academy
    </div>

    <div class="code">404</div>

    <h1>Halaman Tidak Ditemukan</h1>

    <p>
        Maaf, halaman yang Anda cari tidak tersedia,
        mungkin telah dipindahkan atau alamat yang Anda masukkan kurang tepat.
    </p>

    <div class="buttons">
        <a class="btn home" href="/">
            🏠 Halaman Utama
        </a>

        <a class="btn training" href="/pendaftaran.html">
            🎓 Daftar Training
        </a>
    </div>

    <div class="footer">
        © 2026 Miranaya Academy<br>
        Empowering Professionals with AI Skills
    </div>

</div>

</body>
</html>

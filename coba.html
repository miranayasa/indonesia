<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI App - Miranaya</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        button:disabled { background: #ccc; }
        #result { margin-top: 20px; white-space: pre-wrap; background: #f8f9fa; padding: 15px; border: 1px solid #ddd; }
    </style>
</head>
<body>

    <h2>Miranaya AI Client</h2>
    <textarea id="promptInput" placeholder="Tuliskan sesuatu untuk AI..."></textarea>
    <br>
    <button id="sendBtn" onclick="callAI()">Kirim ke AI</button>
    
    <h3>Hasil:</h3>
    <div id="result">Menunggu input...</div>

    <script>
        async function callAI() {
            const prompt = document.getElementById('promptInput').value;
            const resultDiv = document.getElementById('result');
            const sendBtn = document.getElementById('sendBtn');

            if (!prompt.trim()) {
                alert('Prompt tidak boleh kosong!');
                return;
            }

            sendBtn.disabled = true;
            resultDiv.textContent = 'Memproses...';

            try {
                // ⚠️ Ganti URL di bawah dengan URL Cloudflare Worker Anda (contoh: https://dawn-dew-b706.namapengguna.workers.dev)
                const response = await fetch('https://dawn-dew-b706.miranayasa.workers.dev/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ prompt: prompt })
                });

                const data = await response.json();

                if (response.ok) {
                    const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Tidak ada respons teks.";
                    resultDiv.textContent = aiText;
                } else {
                    resultDiv.textContent = 'Error: ' + (data.error || 'Terjadi kesalahan sistem.');
                }
            } catch (error) {
                resultDiv.textContent = 'Network Error: ' + error.message;
            } finally {
                sendBtn.disabled = false;
            }
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrasi Klinik | Jaya Selalu</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --primary: #1e293b;
      --accent: #64748b;
      --secondary: #475569;
      --brand: #0f766e; /* Teal Profesional */
      --border: #e2e8f0;
      --text: #334155;
      --danger: #b94a48;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      margin: 0;
      padding: 40px 20px;
    }

    .container { max-width: 700px; margin: 0 auto; }

    .brand-header { text-align: center; margin-bottom: 35px; }
    .brand-header h1 { font-size: 24px; color: var(--primary); margin: 0; letter-spacing: -0.5px; font-weight: 700; }
    .brand-header p { color: var(--accent); font-size: 14px; margin-top: 6px; }

    .card {
      background: var(--card-bg);
      padding: 40px;
      border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
    }

    h2 { font-size: 16px; color: var(--primary); margin-bottom: 20px; border-bottom: 2px solid var(--bg); padding-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }

    .form-group { margin-bottom: 20px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .full { grid-column: 1 / -1; }

    label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; margin-bottom: 6px; color: var(--secondary); letter-spacing: 0.5px; }
    
    input, select, textarea {
      width: 100%; padding: 12px 16px; border: 1px solid var(--border);
      border-radius: 10px; font-size: 14px; font-family: inherit; color: var(--text); transition: 0.3s; background: #fcfcfc;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.1); background: #ffffff; }
    textarea { resize: vertical; min-height: 90px; }

    .message { display: none; margin-bottom: 20px; padding: 12px; border-radius: 8px; font-size: 13px; }
    .message.error { display: block; background: #fff5f4; border: 1px solid #f1d5d2; color: var(--danger); }

    .btn-submit {
      width: 100%; padding: 14px; background: var(--brand); color: #fff;
      border: none; border-radius: 10px; font-weight: 600; cursor: pointer;
      font-size: 15px; margin-top: 10px; transition: 0.3s;
    }
    .btn-submit:hover { background: #115e59; }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Result Section */
    #resultSection { display: none; text-align: center; }
    .success-badge {
      width: 50px; height: 50px; background: #f0fdf4; color: #16a34a; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 24px; margin: 0 auto 15px;
    }
    .ticket { 
      border: 2px dashed var(--border); padding: 25px; border-radius: 15px;
      background: #fafafa; margin: 20px 0; text-align: left;
    }
    .ticket-number { font-size: 36px; font-weight: 700; color: var(--brand); text-align: center; margin: 5px 0 15px 0; }
    
    .resume-table { width: 100%; font-size: 13px; color: var(--text); border-collapse: collapse; }
    .resume-table td { padding: 5px 0; vertical-align: top; }
    .resume-table td.label-col { width: 35%; color: var(--accent); font-weight: 500; }

    .action-buttons { display: flex; gap: 10px; margin-top: 20px; }
    .action-btn { flex: 1; padding: 12px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; border: none; text-align: center; }
    .btn-print { background: var(--primary); color: #fff; }
    .btn-new { background: #e2e8f0; color: var(--primary); }

    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      .card { padding: 20px; }
    }

    @media print {
      body { background: white; padding: 0; }
      .card { border: none; box-shadow: none; padding: 0; }
      .action-buttons, .brand-header p { display: none; }
      .ticket { border: 2px solid #334155; background: #fff; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="brand-header">
    <h1>Klinik Jaya Selalu</h1>
    <p>Premium Fisiotherapy & Wellness Center</p>
  </div>

  <div class="card">
    
    <!-- FORM SECTION -->
    <div id="formSection">
      <form id="registrationForm">
        <h2>01. Data Pasien</h2>
        <div class="form-grid">
          <div class="form-group"><label>Nama Lengkap *</label><input type="text" name="name" required placeholder="Masukkan nama"></div>
          <div class="form-group"><label>NIK *</label><input type="text" name="nik" required maxlength="16" placeholder="16 digit NIK"></div>
          <div class="form-group"><label>Kelamin *</label><select name="gender" required><option value="">Pilih Kelamin</option><option value="Laki-laki">Laki-laki</option><option value="Perempuan">Perempuan</option></select></div>
          <div class="form-group"><label>Nomor HP *</label><input type="tel" name="phone" required placeholder="08xxxxxxxxxx"></div>
        </div>

        <h2>02. Keluhan & Layanan</h2>
        <div class="form-grid">
          <div class="form-group full"><label>Keluhan Utama *</label><textarea name="complaint" required placeholder="Jelaskan keluhan Anda"></textarea></div>
          <div class="form-group"><label>Layanan *</label><select name="poli" required><option value="">Pilih Layanan</option><option value="Fisioterapi">Fisioterapi</option><option value="Pilates">Pilates</option></select></div>
          <div class="form-group"><label>Bagian Tubuh *</label><input type="text" name="bodyPart" required placeholder="Contoh: Pinggang"></div>
          <div class="form-group"><label>Tanggal Kunjungan *</label><input type="date" name="visitDate" required></div>
          <div class="form-group"><label>Jam Kunjungan *</label><input type="time" name="visitTime" required></div>
        </div>

        <div id="errorMessage" class="message"></div>
        <button type="submit" id="submitButton" class="btn-submit">Proses Pendaftaran</button>
      </form>
    </div>

    <!-- RESULT SECTION -->
    <div id="resultSection">
      <div class="success-badge">✓</div>
      <h2 style="border:none; text-align:center; margin-bottom:0;">Pendaftaran Berhasil</h2>
      <p style="color: var(--accent); font-size: 13px; margin-top: 5px;">Data Anda telah tersimpan dan terkirim ke WhatsApp Klinik.</p>
      
      <div class="ticket">
        <div style="font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--accent); text-align: center;">Nomor Antrian Anda</div>
        <div id="queueNumber" class="queue-number">---</div>
        
        <table class="resume-table">
          <tr><td class="label-col">Nama</td><td>: <span id="resName">-</span></td></tr>
          <tr><td class="label-col">NIK</td><td>: <span id="resNik">-</span></td></tr>
          <tr><td class="label-col">Layanan</td><td>: <span id="resPoli">-</span></td></tr>
          <tr><td class="label-col">Jadwal</td><td>: <span id="resDate">-</span> (<span id="resTime">-</span>)</td></tr>
          <tr><td class="label-col">Keluhan</td><td>: <span id="resComplaint">-</span></td></tr>
        </table>
      </div>

      <div class="action-buttons">
        <button type="button" onclick="window.print()" class="action-btn btn-print">🖨️ Cetak / PDF</button>
        <button type="button" id="newRegistration" class="action-btn btn-new">Pendaftaran Baru</button>
      </div>
    </div>

  </div>
</div>

<script>
  /* =====================================================
     PENGATURAN URL GOOGLE APPS SCRIPT & NOMOR WHATSAPP
  ===================================================== */
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzyKEKZTDlyfg0eiurTD6xW-rNfCqVlz9o5UJQwXAhFL1ggHkZmZQMfNlkXyEOKbp9rYQ/exec";
  const WHATSAPP_NUMBER = "6282290007890"; // Ganti dengan nomor WhatsApp tujuan (tanpa tanda +)

  const form = document.getElementById("registrationForm");
  const submitButton = document.getElementById("submitButton");
  const errorMessage = document.getElementById("errorMessage");
  const formSection = document.getElementById("formSection");
  const resultSection = document.getElementById("resultSection");
  
  const queueNumber = document.getElementById("queueNumber");
  const resName = document.getElementById("resName");
  const resNik = document.getElementById("resNik");
  const resPoli = document.getElementById("resPoli");
  const resDate = document.getElementById("resDate");
  const resTime = document.getElementById("resTime");
  const resComplaint = document.getElementById("resComplaint");
  const newRegistration = document.getElementById("newRegistration");

  form.addEventListener("submit", async function(event) {
    event.preventDefault();
    hideError();

    if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("MASUKKAN_URL")) {
      showError("URL Google Apps Script belum dikonfigurasi.");
      return;
    }

    submitButton.disabled = true;
    submitButton.textContent = "Memproses...";

    try {
      const formData = new FormData(form);
      const response = await fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        body: formData
      });

      const result = await response.json();

      if (!result.success) {
        throw new Error(result.message || "Pendaftaran gagal.");
      }

      const assignedQueue = result.queueNumber || "A-001";
      const vDate = formData.get("visitDate") || "-";
      const vTime = formData.get("visitTime") || "-";
      const pName = formData.get("name") || "-";
      const pNik = formData.get("nik") || "-";
      const pPhone = formData.get("phone") || "-";
      const pPoli = formData.get("poli") || "-";
      const pComplaint = formData.get("complaint") || "-";

      // Masukkan data ke tampilan resume/tiket
      queueNumber.textContent = assignedQueue;
      resName.textContent = pName;
      resNik.textContent = pNik;
      resPoli.textContent = pPoli;
      resDate.textContent = vDate;
      resTime.textContent = vTime;
      resComplaint.textContent = pComplaint;

      // Otomatis buka WhatsApp klinik
      const waMessage = 
        `Halo Admin Klinik Jaya Selalu, Saya ingin mengonfirmasi pendaftaran pasien baru:\n\n` +
        `*No. Antrian:* *${assignedQueue}*\n` +
        `*Nama:* ${pName}\n` +
        `*NIK:* ${pNik}\n` +
        `*No. HP:* ${pPhone}\n` +
        `*Layanan:* ${pPoli}\n` +
        `*Keluhan:* ${pComplaint}\n` +
        `*Jadwal:* ${vDate} (${vTime})\n\n` +
        `Terima kasih.`;

      const waUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(waMessage)}`;
      window.open(waUrl, '_blank');

      formSection.style.display = "none";
      resultSection.style.display = "block";
      form.reset();
      window.scrollTo({ top: 0, behavior: "smooth" });

    } catch (error) {
      console.error(error);
      showError(error.message || "Terjadi kesalahan koneksi.");
    } finally {
      submitButton.disabled = false;
      submitButton.textContent = "Proses Pendaftaran";
    }
  });

  newRegistration.addEventListener("click", function() {
    resultSection.style.display = "none";
    formSection.style.display = "block";
    hideError();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  function showError(msg) {
    errorMessage.textContent = msg;
    errorMessage.className = "message error";
  }

  function hideError() {
    errorMessage.textContent = "";
    errorMessage.className = "message";
  }
</script>

</body>
</html>

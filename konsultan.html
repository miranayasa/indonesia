<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Business Intelligence Studio | Miranaya Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
        .dark .glass { background: rgba(30, 41, 59, 0.7); }
    </style>
</head>
<body class="bg-gray-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 min-h-screen">

    <div class="flex h-screen overflow-hidden">
        <aside class="w-64 glass border-r border-slate-200 dark:border-slate-800 flex flex-col hidden md:flex">
            <div class="p-6">
                <img src="mdemy.png" onerror="this.src='https://placehold.co/150x50/334155/white?text=Miranaya+Academy'" alt="Miranaya Academy" class="h-10 mb-4">
                <h1 class="text-xs font-bold text-slate-400 uppercase tracking-widest">BI Studio</h1>
            </div>
            <nav class="flex-1 px-4 space-y-2 overflow-y-auto">
                <button onclick="showSection('input')" class="w-full flex items-center p-3 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-800 transition"><i data-lucide="layout-dashboard" class="mr-3"></i> New Analysis</button>
            </nav>
            <div class="p-4 border-t border-slate-200 dark:border-slate-800 bg-slate-100 dark:bg-slate-800">
                <p class="text-sm font-semibold mb-2">🚀 Upgrade Your Skills</p>
                <a href="https://miranaya.online/register.html" target="_blank" class="block bg-blue-600 text-white text-center py-2 rounded-lg text-sm mb-2">Daftar Pelatihan</a>
                <p class="text-[10px] text-slate-500">© 2026 Miranaya Academy</p>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto p-8">
            <div id="input-section" class="max-w-4xl mx-auto">
                <h2 class="text-3xl font-bold mb-2">Start Business Analysis</h2>
                <p class="text-slate-500 mb-8">Enter your business details below to generate a comprehensive AI-powered report.</p>
                
                <form id="analysis-form" class="grid grid-cols-1 md:grid-cols-2 gap-6 glass p-8 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700">
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium mb-1">Business Name *</label>
                        <input type="text" id="bizName" required class="w-full p-3 rounded-xl border border-slate-300 dark:bg-slate-800 dark:border-slate-600" placeholder="e.g. EcoPack Solutions">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Business Type *</label>
                        <input type="text" id="bizType" required class="w-full p-3 rounded-xl border border-slate-300 dark:bg-slate-800 dark:border-slate-600" placeholder="e.g. Manufacturing">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Business Category *</label>
                        <input type="text" id="bizCat" required class="w-full p-3 rounded-xl border border-slate-300 dark:bg-slate-800 dark:border-slate-600" placeholder="e.g. Sustainability">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium mb-1">Short Description *</label>
                        <textarea id="bizDesc" required class="w-full p-3 rounded-xl border border-slate-300 dark:bg-slate-800 dark:border-slate-600" rows="3" placeholder="Explain your business concept..."></textarea>
                    </div>
                    <button type="submit" id="submit-btn" class="md:col-span-2 bg-blue-600 text-white p-4 rounded-xl font-bold hover:bg-blue-700 transition">Run AI Analysis</button>
                </form>
            </div>

            <div id="results-section" class="hidden">
                <div id="dashboard-content" class="grid grid-cols-1 lg:grid-cols-3 gap-6"></div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        const form = document.getElementById('analysis-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "Analyzing with AI...";

            const prompt = `Act as a Senior Business Consultant and Financial Analyst. Analyze this business: 
            Name: ${document.getElementById('bizName').value}
            Type: ${document.getElementById('bizType').value}
            Description: ${document.getElementById('bizDesc').value}
            Return ONLY a valid JSON object with these keys: business, summary, decision, score, market, financial, swot, bmc, roadmap, risk, recommendation.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                
                const data = await response.json();
                const jsonText = data.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '');
                const result = JSON.parse(jsonText);
                
                renderDashboard(result);
            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Run AI Analysis";
            }
        });

        function renderDashboard(data) {
            document.getElementById('input-section').classList.add('hidden');
            document.getElementById('results-section').classList.remove('hidden');
            const container = document.getElementById('dashboard-content');
            container.innerHTML = `
                <div class="lg:col-span-3 glass p-6 rounded-3xl">
                    <h3 class="text-2xl font-bold mb-4">Executive Summary</h3>
                    <p>${data.summary || 'Analysis Complete.'}</p>
                </div>
                <div class="glass p-6 rounded-3xl">
                    <h4 class="font-bold mb-2">Business Score</h4>
                    <div class="text-5xl font-extrabold text-blue-600">${data.score || 0}/100</div>
                </div>
                <div class="lg:col-span-2 glass p-6 rounded-3xl">
                    <h4 class="font-bold mb-2">Strategic Recommendation</h4>
                    <p>${data.recommendation || '-'}</p>
                </div>
            `;
        }

        function showSection(id) {
            location.reload();
        }
    </script>
</body>
</html>

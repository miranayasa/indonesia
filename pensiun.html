<!-- JAVASCRIPT LOGIC -->
    <script>
        // Endpoint Cloudflare Worker Anda
        const API_URL = "https://pensiun.miranayasa.workers.dev/";

        let lastAnalysisContext = null;
        let currentFormInput = null;

        // Handler Submit Form Utama
        async function handleFormSubmit(event) {
            event.preventDefault();

            currentFormInput = {
                nama: document.getElementById('nama').value || 'Pengguna',
                usia: parseInt(document.getElementById('usia').value),
                targetUsia: parseInt(document.getElementById('targetUsia').value),
                kota: document.getElementById('kota').value,
                status: document.getElementById('status').value,
                rumah: document.getElementById('rumah').value,
                dana: parseFloat(document.getElementById('dana').value),
                penghasilan: parseFloat(document.getElementById('penghasilan').value) || 0,
                pengeluaran: parseFloat(document.getElementById('pengeluaran').value),
                warisan: parseFloat(document.getElementById('warisan').value) || 0,
                danaDarurat: parseFloat(document.getElementById('danaDarurat').value) || 0,
                asetLain: parseFloat(document.getElementById('asetLain').value) || 0,
                catatan: document.getElementById('catatan').value
            };

            document.getElementById('loadingSection').classList.remove('hidden');
            document.getElementById('errorSection').classList.add('hidden');
            document.getElementById('resultSection').classList.add('hidden');
            window.scrollTo({ top: document.getElementById('loadingSection').offsetTop - 100, behavior: 'smooth' });

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(currentFormInput)
                });

                const responseText = await response.text();
                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (e) {
                    throw new Error(`Respon bukan JSON valid: ${responseText}`);
                }

                if (!response.ok) {
                    throw new Error(data.error || `Server error: ${response.status}`);
                }

                lastAnalysisContext = { input: currentFormInput, result: data };
                renderResults(data);

                document.getElementById('loadingSection').classList.add('hidden');
                document.getElementById('resultSection').classList.remove('hidden');
                window.scrollTo({ top: document.getElementById('resultSection').offsetTop - 100, behavior: 'smooth' });

            } catch (error) {
                console.error(error);
                document.getElementById('loadingSection').classList.add('hidden');
                document.getElementById('errorSection').classList.remove('hidden');
                document.getElementById('errorMessage').innerText = error.message;
            }
        }

        // Fungsi Render Hasil Analisis ke HTML
        function renderResults(data) {
            document.getElementById('resultTimestamp').innerText = new Date().toLocaleDateString('id-ID', { dateStyle: 'long' });
            document.getElementById('resSummary').innerText = data.summary || "Tidak ada ringkasan.";
            document.getElementById('resEstimatedYears').innerText = `${data.estimatedYears || 0} Tahun`;
            document.getElementById('resEstimatedAge').innerText = `Usia ${data.estimatedAge || 0} Tahun`;
            document.getElementById('resHealthScore').innerText = data.financialHealthScore || 0;
            document.getElementById('resInflationImpact').innerText = data.inflationImpact || "Tidak ada data inflasi.";
            document.getElementById('resLifetimeExpense').innerText = `Rp ${(data.lifetimeExpense || 0).toLocaleString('id-ID')}`;
            document.getElementById('resRecommendation').innerText = data.recommendation || "Belum ada rekomendasi.";
            document.getElementById('resConclusion').innerText = data.conclusion || data.summary || "Analisis selesai.";

            const curAge = currentFormInput.usia;
            const estAge = data.estimatedAge;
            const targetAge = currentFormInput.targetUsia;
            
            document.getElementById('labelCurrentAge').innerText = `Umur ${curAge}`;
            document.getElementById('labelEstimatedAge').innerText = `Estimasi ${estAge}`;
            document.getElementById('labelTargetAge').innerText = `Target ${targetAge}`;

            const maxScale = Math.max(targetAge, estAge, curAge + 10);
            const percent = Math.min(Math.max(((estAge - curAge) / (maxScale - curAge)) * 100, 10), 100);
            document.getElementById('graphBar').style.width = `${percent}%`;

            // Gap Analysis
            const gapContainer = document.getElementById('resGapContainer');
            gapContainer.innerHTML = '';
            if (data.gapAnalysis) {
                const gaps = [
                    { label: "Tambahan Modal", val: `Rp ${(data.gapAnalysis.additionalCapital || 0).toLocaleString('id-ID')}` },
                    { label: "Tambahan Passive Income / Bln", val: `Rp ${(data.gapAnalysis.additionalMonthlyIncome || 0).toLocaleString('id-ID')}` },
                    { label: "Maksimal Pengeluaran / Bln", val: `Rp ${(data.gapAnalysis.maximumMonthlyExpense || 0).toLocaleString('id-ID')}` }
                ];
                gaps.forEach(g => {
                    const card = document.createElement('div');
                    card.className = 'bg-slate-50 border border-slate-200 p-4 rounded-2xl';
                    card.innerHTML = `
                        <div class="text-xs text-slate-500 font-semibold mb-1">${g.label}</div>
                        <div class="text-base font-black text-slate-900">${g.val}</div>
                    `;
                    gapContainer.appendChild(card);
                });
            }

            // Scenarios
            const scenariosContainer = document.getElementById('resScenariosContainer');
            scenariosContainer.innerHTML = '';
            if (data.scenarios && Array.isArray(data.scenarios)) {
                data.scenarios.forEach(scen => {
                    const card = document.createElement('div');
                    card.className = 'bg-slate-50 border border-slate-200 p-5 rounded-2xl flex flex-col justify-between space-y-3';
                    
                    let prosHtml = (scen.pros || []).map(p => `<li class="text-emerald-700 flex items-center"><i class="fa-solid fa-plus mr-1.5 text-[9px]"></i>${p}</li>`).join('');
                    let consHtml = (scen.cons || []).map(c => `<li class="text-rose-700 flex items-center"><i class="fa-solid fa-minus mr-1.5 text-[9px]"></i>${c}</li>`).join('');

                    card.innerHTML = `
                        <div>
                            <div class="flex items-center justify-between mb-2">
                                <h5 class="font-bold text-slate-900 text-sm">${scen.name}</h5>
                                <span class="text-[10px] px-2 py-0.5 rounded-full bg-brand-100 text-brand-700 font-bold border border-brand-200">${scen.risk}</span>
                            </div>
                            <div class="text-xs font-semibold text-slate-700 mb-2">Durasi Bertahan: <span class="text-brand-600">${scen.duration} Tahun</span></div>
                            <div class="space-y-1 text-[11px]">${prosHtml}${consHtml}</div>
                        </div>
                    `;
                    scenariosContainer.appendChild(card);
                });
            }

            // Action Plan
            const actionPlanContainer = document.getElementById('resActionPlan');
            actionPlanContainer.innerHTML = '';
            if (data.actionPlan && Array.isArray(data.actionPlan)) {
                data.actionPlan.forEach((step, index) => {
                    const div = document.createElement('div');
                    div.className = 'bg-slate-50 border border-slate-200 p-3.5 rounded-xl flex items-start space-x-3 text-xs';
                    div.innerHTML = `
                        <div class="bg-brand-100 text-brand-700 font-bold px-2 py-0.5 rounded-lg border border-brand-200">#${index + 1}</div>
                        <div class="text-slate-700 pt-0.5 leading-relaxed">${step}</div>
                    `;
                    actionPlanContainer.appendChild(div);
                });
            }
        }

        // Handler Chat Lanjutan
        async function handleChatSubmit(event) {
            event.preventDefault();
            const inputField = document.getElementById('chatInput');
            const question = inputField.value.trim();
            if (!question) return;

            const chatHistory = document.getElementById('chatHistory');
            
            // Tambah pesan user ke chat box
            chatHistory.innerHTML += `<div class="bg-brand-50 border border-brand-200 rounded-2xl p-4 text-xs text-brand-900 ml-8"><b>Anda:</b> ${question}</div>`;
            inputField.value = '';
            chatHistory.scrollTop = chatHistory.scrollHeight;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chatQuery: question, previousContext: lastAnalysisContext })
                });

                const resText = await response.text();
                const resData = JSON.parse(resText);

                if (!response.ok) throw new Error(resData.error || "Gagal memproses chat");

                chatHistory.innerHTML += `<div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 text-xs text-slate-700 mr-8"><b>AI Advisor:</b> ${resData.answer}</div>`;
                chatHistory.scrollTop = chatHistory.scrollHeight;

            } catch (err) {
                chatHistory.innerHTML += `<div class="bg-red-50 border border-red-200 rounded-2xl p-4 text-xs text-red-700 mr-8"><b>Error:</b> ${err.message}</div>`;
            }
        }
    </script>
</body>
</html>
